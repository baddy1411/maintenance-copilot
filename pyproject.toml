[project]
name = "maintenance-copilot"
version = "0.1.0"
description = "Cited Q&A and an approval-gated troubleshooting agent over live FAA maintenance data"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "MIT"
dependencies = [
    "alembic==1.20.1",
    "fastapi==0.162.0",
    "httpx2==2.16.0",  # what openai 3.x uses; one HTTP stack for the SDK, rerank and catalog
    "langgraph==1.2.18",
    "langgraph-checkpoint-postgres==3.2.0",
    "openai==3.41.0",
    "pgvector==0.5.1",
    "procrastinate==3.10.0",
    "psycopg[binary,pool]==3.3.6",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.2",
    "sqlalchemy==2.1.6",
    "uvicorn==0.54.0",
]

[project.scripts]
copilot = "app.cli:main"

[dependency-groups]
dev = [
    "mypy==2.4.1",
    "pip-audit",
    "pre-commit==4.7.0",
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1",
    "ruff==0.17.3",
    "testcontainers[postgres]==4.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = ["spikes", "*.md"]
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S608"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["app"]
exclude = ["spikes/"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["procrastinate.*", "pgvector.*", "testcontainers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: needs Docker (real Postgres via testcontainers)"]
